<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Welcome to FreeLifeTools Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #17191c;
    }

    .wrap {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;
    }

    .card {
      width: 100%;
      max-width: 600px;

      background: white;

      border-radius: 22px;
      padding: 45px 30px;

      text-align: center;

      box-shadow: 0 15px 45px rgba(0,0,0,.08);
    }

    .check {
      width: 75px;
      height: 75px;

      margin: 0 auto 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #eaf8ef;
      border-radius: 50%;

      font-size: 35px;
    }

    h1 {
      margin: 0 0 15px;

      font-size: 38px;
      letter-spacing: -1.5px;
    }

    p {
      margin: 0 auto;

      max-width: 470px;

      color: #6b7077;
      line-height: 1.7;
      font-size: 16px;
    }

    .button {
      display: inline-block;

      margin-top: 28px;

      background: #17191c;
      color: white;

      padding: 14px 22px;

      border-radius: 10px;

      font-weight: 800;
      text-decoration: none;
    }

    .small {
      margin-top: 25px;

      font-size: 13px;
      color: #90949a;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div class="card">

      <div class="check">
        ✓
      </div>

      <h1>
        Welcome to Life Pro!
      </h1>

      <p>
        Your subscription was successful.
        You now have access to FreeLifeTools Pro features
        and premium planning tools.
      </p>

      <a class="button" href="pro.html">
        Go to Pro Tools
      </a>

      <div class="small">
        Thank you for supporting FreeLifeTools.
      </div>

    </div>

  </div>

</body>
</html>
