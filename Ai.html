  <title>AI Tools | FreeLifeTools</title>
  <meta name="description" content="Free AI tools and ideas for work, business and everyday life.">

  <style>
    * {
      box-sizing: border-box;

    html {

    body {

      font-family: Arial, sans-serif;
      background: #f5f4fa;

    nav {

    .tag {

    }

      max-width: 850px;
      margin: auto;
      background: white;
      border: 1px solid #e1dfe6;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(30,20,50,0.06);
    }

    .ai-box h2 {
      margin-top: 0;
      font-size: 23px;
    }

    .ai-box p {
      color: #716c77;
      font-size: 14px;
      line-height: 1.5;
    }

    textarea {

      border-radius: 12px;
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      margin-top: 10px;
    }

    textarea:focus {
      outline: 2px solid #d5d1dc;
    }

    .button {
      border: none;
      border-radius: 10px;
      background: #19171f;
      color: white;
      padding: 14px 22px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }

    .button:hover {
      opacity: 0.88;
    }

    #aiResult {
      display: none;
      margin-top: 22px;
      padding: 20px;
      background: #f6f4f9;
      border: 1px solid #e7e3eb;
      border-radius: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .section {
      margin-top: 70px;
    }

    .section-heading {
      margin-bottom: 25px;
    }

    .section-heading h2 {
      font-size: 30px;
      margin: 0 0 8px;
    }

    .section-heading p {
      color: #716c77;
      margin: 0;
    }

    .ai-tools {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .tool {
      background: white;
      border: 1px solid #e1dfe6;
      border-radius: 16px;
      padding: 25px;
      min-height: 200px;
    }

    .tool-icon {
      font-size: 30px;
      margin-bottom: 16px;
    }

    .tool h3 {
      margin: 0 0 10px;
      font-size: 19px;
    }

    .tool p {
      color: #706b76;
      font-size: 14px;
      line-height: 1.55;
      margin-bottom: 20px;
    }

    .tool a {
      color: #19171f;
      font-weight: 700;
      font-size: 14px;
    }

    .pro {

      background: #19171f;
      color: white;
      border-radius: 20px;
      padding: 40px;

      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 30px;
    }

    .pro h2 {
      font-size: 30px;
      margin: 0 0 12px;
    }

    .pro p {
      color: #d0ccd5;
      line-height: 1.6;
      max-width: 650px;
    }

    .pro .button {
      background: white;
      color: #19171f;
      text-decoration: none;
      white-space: nowrap;
    }

      color: #6b6670;
