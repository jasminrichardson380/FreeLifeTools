<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | FreeLifeTools</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f8f5;
      color: #0d2b21;
    }

    .wrap {
      max-width: 520px;
      margin: 50px auto;
      padding: 22px;
    }

    .card {
      background: white;
      border: 1px solid #d7e5dd;
      border-radius: 28px;
      padding: 32px;
    }

    h1 {
      font-size: 40px;
      margin: 0 0 15px;
    }

    p {
      color: #6c7771;
      font-size: 18px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 22px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 18px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      border: 2px solid #d7e5dd;
      border-radius: 16px;
      font-size: 18px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 17px;
      border: none;
      border-radius: 16px;
      background: #07935f;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 14px;
      font-weight: bold;
      line-height: 1.4;
    }

    .error {
      display: block !important;
      background: #fdeaea;
      color: #9b2c2c;
    }

    .success {
      display: block !important;
      background: #e6f7ef;
      color: #07633f;
    }

    .links {
      text-align: center;
      margin-top: 24px;
      line-height: 2;
    }

    a {
      color: #07935f;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>Log in</h1>

    <p>
      Sign in to your FreeLifeTools account.
    </p>

    <div id="message"></div>

    <form id="loginForm">

      <label for="email">Email address</label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Log in
      </button>

    </form>

    <div class="links">
      <a href="/signup.html">Create account</a><br>
      <a href="/">Back to home</a>
    </div>

  </div>
</div>

<script type="module">

  import {
    login
  } from "https://esm.sh/@netlify/identity";

  const form =
    document.getElementById("loginForm");

  const button =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
  }

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Logging in...";

    try {

      const user = await login(email, password);

      console.log("Logged in:", user);

      showMessage(
        "Login successful! Taking you to your account...",
        "success"
      );

      setTimeout(() => {
        window.location.href = "/account.html";
      }, 1000);

    } catch (error) {

      console.error("Login error:", error);

      let text =
        "Could not log in.";

      if (error && error.message) {
        text = error.message;
      }

      showMessage(text, "error");

      button.disabled = false;
      button.textContent = "Log in";
    }

  });

</script>

</body>
</html>
