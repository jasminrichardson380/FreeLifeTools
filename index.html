  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #10182c;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
    }

    /* HEADER */

    header {
      background: #07172f;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 18px rgba(0,0,0,.15);
    }

    .nav {
      max-width: 1180px;
      margin: auto;
      min-height: 72px;
      padding: 14px 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      color: white;
      font-size: 25px;
      font-weight: 800;
      white-space: nowrap;
    }

    .logo span {
      color: #3887ff;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
    }

    nav a {
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      opacity: .9;
    }

    nav a:hover {
      color: #5da0ff;
    }

    /* HERO */

    .hero {
      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 90% 25%,
          rgba(210,36,255,.6),
          transparent 34%
        ),
        radial-gradient(
          circle at 5% 90%,
          rgba(0,169,255,.35),
          transparent 35%
        ),
        linear-gradient(
          120deg,
          #062864 0%,
          #10105b 48%,
          #2b0d71 75%,
          #701b89 100%
        );

      color: white;
    }

    .hero-inner {
      max-width: 1180px;
      margin: auto;
      padding: 72px 22px 78px;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 55px;
      align-items: center;
    }

    .hero-tag {
      display: inline-block;

      background: rgba(48,126,255,.75);
      border: 1px solid rgba(255,255,255,.15);

      padding: 8px 15px;
      border-radius: 999px;

      font-size: 12px;
      font-weight: 800;
      letter-spacing: .4px;

      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(42px, 6vw, 70px);
      line-height: 1.02;
      margin-bottom: 22px;
      letter-spacing: -2px;
    }

    .hero h1 span {
      color: #4596ff;
    }

    .hero-text {
      max-width: 560px;
      font-size: 19px;
      line-height: 1.7;
      color: #edf4ff;
      margin-bottom: 30px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 23px;
    }
