<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Contact FreeLifeTools | Questions & Feedback</title>

  <meta
    name="description"
    content="Contact FreeLifeTools with questions, feedback, corrections or other inquiries about our free calculators and practical tools."
  >

  <link
    rel="canonical"
    href="https://elaborate-maamoul-1fad9f.netlify.app/contact.html"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
      line-height: 1.7;
    }

    header {
      background: #07172f;
    }

    .nav {
      max-width: 1050px;
      margin: auto;
      padding: 18px 20px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 23px;
      font-weight: 900;
    }

    .logo span {
      color: #3887ff;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 17px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    nav a:hover {
      color: #5da0ff;
    }

    .hero {
      background:
        radial-gradient(
          circle at 90% 20%,
          rgba(163,52,255,.5),
          transparent 35%
        ),
        linear-gradient(
          120deg,
          #062864,
          #17105d,
          #54157a
        );

      color: white;
      text-align: center;
      padding: 70px 20px;
    }

    .hero-inner {
      max-width: 720px;
      margin: auto;
    }

    .tag {
      display: inline-block;
      background: rgba(70,145,255,.3);
      border: 1px solid rgba(255,255,255,.15);
      padding: 7px 14px;
      border-radius: 999px;

      font-size: 12px;
      font-weight: 900;
      margin-bottom: 17px;
    }

    h1 {
      font-size: 48px;
      line-height: 1.1;
      margin: 0 0 18px;
    }

    .hero p {
      font-size: 18px;
      color: #e8efff;
      margin: 0;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 55px 20px 75px;
    }

    .contact-card {
      background: white;
      border: 1px solid #e2e7f0;
      border-radius: 18px;
      padding: 32px;
      margin-bottom: 24px;

      box-shadow: 0 8px 25px rgba(20,30,60,.05);
    }

    .contact-card h2 {
      margin-top: 0;
      font-size: 27px;
    }

    .contact-card p {
      color: #606b7d;
    }

    .email-box {
      margin: 25px 0;

      background: #eef4ff;
      border: 1px solid #d7e4ff;
      border-radius: 14px;

      padding: 24px;
      text-align: center;
    }

    .email-icon {
      font-size: 35px;
      margin-bottom: 8px;
    }

    .email-box h3 {
      margin: 0 0 8px;
    }

    .email-link {
      color: #1559d6;
      font-weight: 800;
      word-break: break-word;
    }

    .email-button {
      display: inline-block;
      margin-top: 15px;

      background: #1769ff;
      color: white;

      padding: 12px 18px;
      border-radius: 9px;

      text-decoration: none;
      font-weight: 800;
    }

    .help-list {
      padding-left: 22px;
      color: #606b7d;
    }

    .help-list li {
      margin-bottom: 10px;
    }

    .notice {
      background: #fff8e8;
      border: 1px solid #f2dfae;
      border-radius: 12px;
      padding: 18px;
      color: #675521;
      margin-top: 22px;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .links a {
      background: #eef4ff;
      color: #1559d6;
      text-decoration: none;
      padding: 15px;
      border-radius: 10px;
      font-weight: 800;
    }

    footer {
      background: #07172f;
      color: #dce1eb;
      text-align: center;
      padding: 35px 20px;
      font-size: 14px;
    }

    footer a {
      color: white;
      text-decoration: none;
      margin: 0 7px;
    }

    @media (max-width: 700px) {

      .nav {
        flex-direction: column;
      }
