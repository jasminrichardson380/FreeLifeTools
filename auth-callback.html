<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Account | FreeLifeTools</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f8f5;
      color: #0d2b21;
    }

    .wrap {
      max-width: 520px;
      margin: 60px auto;
      padding: 24px;
    }

    .card {
      background: white;
      border: 1px solid #d7e5dd;
      border-radius: 28px;
      padding: 32px;
    }

    h1 {
      font-size: 40px;
      margin-top: 0;
    }

    p {
      color: #6c7771;
      line-height: 1.5;
      font-size: 18px;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 24px;
      padding: 17px;
      border-radius: 16px;
      background: #07935f;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
    }

    #message {
      font-weight: bold;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1 id="title">Confirming your account...</h1>

    <p id="message">
      Please wait while we verify your FreeLifeTools account.
    </p>

    <a id="loginButton" href="/login.html" style="display:none;">
      Log in
    </a>

  </div>
</div>

<script type="module">

  import {
    handleAuthCallback
  } from "https://esm.sh/@netlify/identity";

  const title =
    document.getElementById("title");

  const message =
    document.getElementById("message");

  const loginButton =
    document.getElementById("loginButton");

  async function finishAuth() {

    try {

      const result = await handleAuthCallback();

      if (!result) {
        title.textContent =
          "This link is no longer valid";

        message.textContent =
          "The confirmation link may have expired or already been used.";

        loginButton.style.display = "block";
        return;
      }

      if (result.type === "confirmation") {

        title.textContent =
          "Your account is confirmed!";

        message.textContent =
          "Your FreeLifeTools account is ready. You can now log in.";

        loginButton.style.display = "block";
        return;
      }

      if (result.type === "invite") {

        title.textContent =
          "Your account is ready!";

        message.textContent =
          "Your invitation was accepted. You can now log in.";

        loginButton.style.display = "block";
        return;
      }

      if (result.type === "recovery") {

        window.location.replace(
          "/reset-password.html" + window.location.hash
        );

        return;
      }

      title.textContent =
        "Account verified";

      message.textContent =
        "Your account has been verified successfully.";

      loginButton.style.display = "block";

    } catch (error) {

      console.error(error);

      title.textContent =
        "We could not confirm your account";

      message.textContent =
        "This confirmation link may have expired or already been used. Please try signing up again or request a new confirmation email.";

      loginButton.style.display = "block";
    }
  }

  finishAuth();

</script>

</body>
</html>
