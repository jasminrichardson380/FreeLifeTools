<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | FreeLifeTools</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f8f5;
      color: #0d2b21;
    }

    .wrap {
      max-width: 520px;
      margin: 50px auto;
      padding: 22px;
    }

    .card {
      background: white;
      border: 1px solid #d7e5dd;
      border-radius: 28px;
      padding: 32px;
    }

    h1 {
      font-size: 40px;
      margin: 0 0 15px;
    }

    p {
      color: #6c7771;
      font-size: 18px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 22px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 18px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      border: 2px solid #d7e5dd;
      border-radius: 16px;
      font-size: 18px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 17px;
      border: none;
      border-radius: 16px;
      background: #07935f;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 14px;
      font-weight: bold;
      line-height: 1.4;
    }

    .success {
      display: block !important;
      background: #e6f7ef;
      color: #07633f;
    }

    .error {
      display: block !important;
      background: #fdeaea;
      color: #9b2c2c;
    }

    .login {
      text-align: center;
      margin-top: 24px;
    }

    a {
      color: #07935f;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>Create your account</h1>

    <p>
      Create a free FreeLifeTools account.
      Your Pro access can stay connected to your account
      when you sign in on another device.
    </p>

    <div id="message"></div>

    <form id="signupForm">

      <label for="name">
        Your name (optional)
      </label>

      <input
        id="name"
        type="text"
        autocomplete="name"
      >

      <label for="email">
        Email address
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button id="signupButton" type="submit">
        Create account
      </button>

    </form>

    <div class="login">
      Already have an account?
      <a href="/login.html">Log in</a>
    </div>

  </div>
</div>

<script type="module">

  import {
    signup,
    AuthError
  } from "https://esm.sh/@netlify/identity";

  const form =
    document.getElementById("signupForm");

  const button =
    document.getElementById("signupButton");

  const message =
    document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
  }

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const name =
      document.getElementById("name").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (password.length < 8) {
      showMessage(
        "Your password must be at least 8 characters.",
        "error"
      );
      return;
    }

    button.disabled = true;
    button.textContent = "Creating account...";

    try {

      const user = await signup(
        email,
        password,
        name ? { full_name: name } : {}
      );

      form.style.display = "none";

      if (user && user.emailVerified) {

        showMessage(
          "Account created successfully! You can now log in.",
          "success"
        );

      } else {

        showMessage(
          "Account created! Check your email and tap the confirmation link to finish setting up your account.",
          "success"
        );

      }

    } catch (error) {

      console.error("Signup error:", error);

      let text =
        "Could not create your account.";

      if (error instanceof AuthError) {

        if (error.status === 403) {
          text =
            "New account registration is currently unavailable.";
        } else if (error.status === 422) {
          text =
            "An account with this email may already exist.";
        } else if (error.message) {
          text = error.message;
        }

      } else if (error && error.message) {
        text = error.message;
      }

      showMessage(text, "error");

      button.disabled = false;
      button.textContent = "Create account";
    }

  });

</script>

</body>
</html>
