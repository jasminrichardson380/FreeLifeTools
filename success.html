<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Welcome to FreeLifeTools Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #17191c;
    }

    .wrap {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;
    }

    .card {
      width: 100%;
      max-width: 600px;

      background: white;
      border-radius: 22px;
      padding: 45px 30px;

      text-align: center;

      box-shadow: 0 15px 45px rgba(0,0,0,.08);
    }

    .status {
      width: 75px;
      height: 75px;

      margin: 0 auto 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #eef0f2;
      border-radius: 50%;

      font-size: 34px;
    }

    h1 {
      margin: 0 0 15px;

      font-size: 38px;
      letter-spacing: -1.5px;
    }

    p {
      margin: 0 auto;

      max-width: 470px;

      color: #6b7077;
      line-height: 1.7;
      font-size: 16px;
    }

    .button {
      display: none;

      margin-top: 28px;

      background: #17191c;
      color: white;

      padding: 14px 22px;
      border-radius: 10px;

      font-weight: 800;
      text-decoration: none;
    }

    .error-link {
      display: none;

      margin-top: 20px;

      color: #17191c;
      font-weight: 700;
    }

    .small {
      margin-top: 25px;

      font-size: 13px;
      color: #90949a;
    }

    .account-note {
      display: none;

      margin: 22px auto 0;
      max-width: 470px;

      color: #4a4f56;
      line-height: 1.7;
      font-size: 15px;
    }

    .account-note a {
      color: #17191c;
      font-weight: 800;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div class="card">

      <div class="status" id="statusIcon">
        …
      </div>

      <h1 id="title">
        Verifying your payment
      </h1>

      <p id="message">
        Please wait while we confirm your Life Pro subscription.
      </p>

      <a
        class="button"
        id="proButton"
        href="/.netlify/functions/check-pro"
      >
        Go to Pro Tools
      </a>

      <a
        class="error-link"
        id="backLink"
        href="pro.html"
      >
        Return to Pro
      </a>

      <p class="account-note" id="accountNote"></p>

      <div class="small">
        FreeLifeTools Pro
      </div>

    </div>

  </div>


  <script>

    async function verifyPayment() {

      const params =
        new URLSearchParams(window.location.search);

      const sessionId =
        params.get("session_id");

      const icon =
        document.getElementById("statusIcon");

      const title =
        document.getElementById("title");

      const message =
        document.getElementById("message");

      const proButton =
        document.getElementById("proButton");

      const backLink =
        document.getElementById("backLink");

      const accountNote =
        document.getElementById("accountNote");


      if (!sessionId) {

        icon.textContent = "!";
        title.textContent = "Payment not verified";

        message.textContent =
          "We could not find a valid checkout session.";

        backLink.style.display = "inline-block";

        return;
      }


      try {

        const response = await fetch(
  "/.netlify/functions/activate-pro?session_id=" +
  encodeURIComponent(sessionId),
  {
    credentials: "same-origin"
  }
);

        const data = await response.json();


        if (data.verified === true) {

          icon.textContent = "✓";

          icon.style.background = "#eaf8ef";

          title.textContent =
            "Welcome to Life Pro!";

          message.textContent =
            "Your subscription was successfully verified. You now have access to your FreeLifeTools Pro tools.";

          proButton.style.display =
            "inline-block";

          // Also give the visitor's Identity account the Pro role, which is
          // what unlocks the role-protected Pro tools.
          await attachProToAccount(sessionId, accountNote);

        } else {

          icon.textContent = "!";

          title.textContent =
            "Payment not verified";

          message.textContent =
            "We could not verify this subscription. Please return to the Pro page and try again.";

          backLink.style.display =
            "inline-block";
        }

      } catch (error) {

        icon.textContent = "!";

        title.textContent =
          "Verification error";

        message.textContent =
          "We could not verify your payment right now. Please try again.";

        backLink.style.display =
          "inline-block";
      }
    }


    async function attachProToAccount(sessionId, note) {

      function show(html) {
        note.innerHTML = html;
        note.style.display = "block";
      }

      try {

        const response = await fetch(
          "/.netlify/functions/grant-pro?session_id=" +
            encodeURIComponent(sessionId),
          {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json"
            },
            body: "{}"
          }
        );

        const result = await response.json();

        if (result.granted === true) {
          show(
            "Pro access has been added to your FreeLifeTools account. " +
              "It works on any device you log in from."
          );
          return;
        }

        if (result.reason === "not-logged-in") {

          const back = encodeURIComponent(
            "/success.html?session_id=" + sessionId
          );

          show(
            "One more step: log in so this Pro access is saved to your " +
              "account. <a href=\"/login.html?redirect=" + back + "\">Log in</a>" +
              " or <a href=\"/signup.html?redirect=" + back + "\">create a free account</a>."
          );
          return;
        }

        if (result.reason === "other-account") {
          show(
            "This payment is already linked to a different FreeLifeTools " +
              "account. Log in with that account to use your Pro tools."
          );
          return;
        }

        show(
          "We could not add Pro access to your account automatically. " +
            "Please <a href=\"contact.html\">contact us</a> and we will fix it."
        );

      } catch (error) {

        show(
          "We could not add Pro access to your account automatically. " +
            "Please <a href=\"contact.html\">contact us</a> and we will fix it."
        );
      }
    }


    verifyPayment();

  </script>

<script src="/auth.js" defer></script>

</body>
</html>
