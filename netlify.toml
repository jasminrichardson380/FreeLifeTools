[build]
  publish = "."
  functions = "netlify/functions"

# AI Store Builder — Pro members only
[[redirects]]
  from = "/ai-store-builder.html"
  to = "/ai-store-builder.html"
  status = 200
  force = true
  conditions = {Role = ["pro", "Pro"]}

[[redirects]]
  from = "/ai-store-builder.html"
  to = "/pro.html?locked=ai-store-builder"
  status = 302
  force = true

[[redirects]]
  from = "/ai-store-builder"
  to = "/ai-store-builder.html"
  status = 200
  force = true
  conditions = {Role = ["pro", "Pro"]}

[[redirects]]
  from = "/ai-store-builder"
  to = "/pro.html?locked=ai-store-builder"
  status = 302
  force = true

# Protect all pro-* pages
[[redirects]]
  from = "/pro-*"
  to = "/pro-:splat"
  status = 200
  force = true
  conditions = {Role = ["pro", "Pro"]}

[[redirects]]
  from = "/pro-*"
  to = "/pro.html?locked=pro-tools"
  status = 302
  force = true
