<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeLifeTools Pro Tools</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 15px;
      box-sizing: border-box;
      margin: 15px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      padding: 14px 25px;
      font-size: 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    #response {
      margin-top: 25px;
      padding: 20px;
      background: #f5f7fb;
      border-radius: 10px;
      min-height: 50px;
    }
  </style>
</head>

<body>

<header>
  <strong>FreeLifeTools Pro</strong>

  <nav>
    <a href="index.html">Free Tools</a>
    <a href="pro.html">Pro Membership</a>
  </nav>
</header>

<main>

  <div class="card">

    <h1>AI Life Assistant 🤖</h1>

    <p>Tell the assistant what you need help with.</p>

    <textarea id="question" placeholder="Example: Help me create a monthly budget..."></textarea>

    <button onclick="askAI()">Ask AI</button>

    <div id="response">
      Your AI response will appear here.
    </div>

  </div>

</main>

<script>
  function askAI() {
    const question = document.getElementById("question").value.trim();
    const response = document.getElementById("response");

    if (!question) {
      response.textContent = "Please enter a question first.";
      return;
    }

    response.textContent =
      "Your AI assistant will be connected here securely in the next step.";
  }
</script>

</body>
</html>
