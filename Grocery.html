<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Budget Planner | FreeLifeTools</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <a class="logo" href="index.html">FreeLifeTools</a>

  <nav>
    <a href="index.html">Home</a>
    <a href="budget.html">Budget</a>
    <a href="grocery.html">Groceries</a>
      <a data-auth-link href="login.html">Log in</a>
  </nav>
</header>

<main class="page">

  <span>FREE EVERYDAY TOOL</span>

  <h1>Grocery Budget Planner</h1>

  <p class="lead">
    Plan your grocery spending and see how much of your budget remains.
  </p>

  <div class="calculator">

    <label>
      Grocery budget
      <input id="groceryBudget" type="number" min="0" step="0.01" placeholder="500">
    </label>

    <label>
      Meat / protein
      <input id="meat" type="number" min="0" step="0.01" placeholder="100">
    </label>

    <label>
      Fruits & vegetables
      <input id="produce" type="number" min="0" step="0.01" placeholder="75">
    </label>

    <label>
      Dairy
      <input id="dairy" type="number" min="0" step="0.01" placeholder="50">
    </label>

    <label>
      Pantry items
      <input id="pantry" type="number" min="0" step="0.01" placeholder="75">
    </label>

    <label>
      Snacks / other
      <input id="groceryOther" type="number" min="0" step="0.01" placeholder="50">
    </label>

    <button class="button" onclick="calculateGroceries()">
      Calculate Grocery Budget
    </button>

    <div id="groceryResult">
      Enter your grocery budget above.
    </div>

  </div>

</main>

<footer>
  <strong>FreeLifeTools</strong>
  <p>Free tools for money, jobs, AI and everyday life.</p>
  <p>© 2026 FreeLifeTools</p>
</footer>

<script src="script.js"></script>

<script src="/auth.js" defer></script>

</body>
</html>
