<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Question Generator | FreeLifeTools</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <a class="logo" href="index.html">FreeLifeTools</a>

  <nav>
    <a href="index.html">Home</a>
    <a href="resume.html">Resume</a>
    <a href="ai-tools.html">AI Tools</a>
    <a href="interview.html">Interview</a>
  </nav>
</header>

<main class="page">

  <span>FREE JOB TOOL</span>

  <h1>Interview Question Generator</h1>

  <p class="lead">
    Practice common interview questions for the job you're applying for.
  </p>

  <div class="calculator">

    <label>
      Job title
      <input id="interviewJob" type="text"
        placeholder="Example: Customer Service Associate">
    </label>

    <label>
      Interview type
      <select id="interviewType">
        <option value="general">General Interview</option>
        <option value="customer">Customer Service</option>
        <option value="retail">Retail</option>
        <option value="office">Office / Administrative</option>
        <option value="management">Management</option>
      </select>
    </label>

    <button class="button" onclick="generateInterviewQuestions()">
      Generate Questions
    </button>

    <div id="interviewResult">
      Enter a job title above.
    </div>

  </div>

</main>

<footer>
  <strong>FreeLifeTools</strong>
  <p>Free tools for money, jobs, AI and everyday life.</p>
  <p>© 2026 FreeLifeTools</p>
</footer>

<script src="script.js"></script>

</body>
</html>
