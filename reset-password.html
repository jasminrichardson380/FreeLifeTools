<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | FreeLifeTools</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f8f5;
      color: #0d2b21;
    }

    .wrap {
      max-width: 520px;
      margin: 60px auto;
      padding: 24px;
    }

    .card {
      background: white;
      border: 1px solid #d7e5dd;
      border-radius: 28px;
      padding: 32px;
    }

    h1 {
      font-size: 40px;
      margin-top: 0;
    }

    p {
      color: #6c7771;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 22px 0 8px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      font-size: 18px;
      border: 2px solid #d7e5dd;
      border-radius: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 17px;
      border: 0;
      border-radius: 16px;
      background: #07935f;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="card">

      <h1>Set a new password</h1>

      <p>
        Enter the new password you want to use for your
        FreeLifeTools account.
      </p>

      <label for="password">New password</label>

      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
      >

      <button id="savePassword" disabled>
        Save new password
      </button>

      <div id="message">
        Checking your password-reset link...
      </div>

    </div>
  </div>

  <script type="module">
    import {
      handleAuthCallback,
      updateUser
    } from "https://esm.sh/@netlify/identity";

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("savePassword");

    const passwordInput =
      document.getElementById("password");

    let recoveryReady = false;

    async function startRecovery() {
      try {
        const result = await handleAuthCallback();

        if (result && result.type === "recovery") {
          recoveryReady = true;
          button.disabled = false;

          message.textContent =
            "Reset link verified. Enter your new password.";
        } else {
          message.textContent =
            "This reset link is missing or has already been used. Please request a new password-reset email.";
        }

      } catch (error) {
        console.error(error);

        message.textContent =
          "This password-reset link is invalid or expired. Please request a new reset email.";
      }
    }

    button.addEventListener("click", async () => {

      const password = passwordInput.value;

      if (!recoveryReady) {
        message.textContent =
          "Please open a new password-reset link from your email.";
        return;
      }

      if (password.length < 8) {
        message.textContent =
          "Your password must be at least 8 characters.";
        return;
      }

      button.disabled = true;
      button.textContent = "Saving...";

      try {

        await updateUser({
          password: password
        });

        message.textContent =
          "Password changed successfully! Taking you to login...";

        setTimeout(() => {
          window.location.href = "/login.html";
        }, 1500);

      } catch (error) {
        console.error(error);

        message.textContent =
          "Could not change your password. Please request a new reset link.";

        button.disabled = false;
        button.textContent = "Save new password";
      }
    });

    startRecovery();
  </script>

</body>
</html>
